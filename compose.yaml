services:
  web:
    image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    user: "${LOCAL_UID:?Use ./scripts/docker}:${LOCAL_GID:?Use ./scripts/docker}"
    userns_mode: host
    init: true
    working_dir: /app
    environment:
      HOME: /app/.cache/home
      npm_config_cache: /app/.cache/npm
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    env_file:
      - path: .env.local
        required: false
    volumes:
      - type: bind
        source: .
        target: /app
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${DEV_PORT:-3000}:3000"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/fr').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 5
